[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medical-triage-mlops"
version = "0.1.0"
description = "MLOps pipeline for medical text classification, observability, and latency optimization."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "marcellossf" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "joblib>=1.4,<2.0",
  "numpy>=1.26,<3.0",
  "onnxruntime>=1.20,<2.0",
  "pandas>=2.2,<3.0",
  "prometheus-client>=0.21,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "scikit-learn>=1.5,<2.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "onnx>=1.17,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.9,<1.0",
  "skl2onnx>=1.18,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/medical_triage"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["medical_triage"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"airflow/dags/*.py" = ["E402"]
