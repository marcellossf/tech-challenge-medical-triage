services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: medical-triage-api:local
    restart: unless-stopped
    environment:
      TRIAGE_MODEL_BACKEND: ${MODEL_BACKEND:-sklearn}
      TRIAGE_SKLEARN_MODEL_PATH: /app/artifacts/model.joblib
      TRIAGE_SKLEARN_METADATA_PATH: /app/artifacts/model_metadata.json
      TRIAGE_ONNX_MODEL_PATH: /app/artifacts/model.onnx
      TRIAGE_ONNX_METADATA_PATH: /app/artifacts/onnx_metadata.json
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
    networks:
      - observability

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
    networks:
      - observability

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - observability

volumes:
  prometheus-data:
  grafana-data:

networks:
  observability:
    driver: bridge
